    <style>
      :root{--ink:#162437;--muted:#64748b;--line:#e4eaf1;--canvas:#f6f8fb;--navy:#102f4d;--blue:#2475d4;--green:#16815b;--yellow:#c78310;--red:#ca4c53;--purple:#7758b8;--card:#fff}

      button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#d8e7f4;padding:26px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 30px;color:#fff}.mark{width:32px;height:32px;border-radius:9px;background:#48a7e8;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:#9cc1dc;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.brand strong{font-size:16px}.nav-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7fa9c7;padding:0 11px 8px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#c5d7e5;text-align:left;padding:11px;border-radius:8px;cursor:pointer;font-size:13px}.nav button:hover,.nav button.active{background:#214a6c;color:white}.nav .icon{display:inline-block;width:20px}.side-foot{margin-top:auto;border-top:1px solid #315a79;padding:18px 10px 0;font-size:12px;color:#a9c4d8}.avatar{width:28px;height:28px;border-radius:50%;background:#4f8bb7;color:#fff;display:inline-grid;place-items:center;margin-right:8px;font-weight:700}
      main{margin-left:250px;flex:1;padding:28px 38px 44px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.eyebrow{font-size:11px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;font-weight:750}.topbar h1{font-size:27px;letter-spacing:-.035em;margin:4px 0 0}.period{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:8px;font-size:13px;color:#44556a}.period:before{content:"●";color:var(--green);font-size:10px;margin-right:8px}
      .grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:0 2px 4px #18314a05}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:30px;font-weight:750;letter-spacing:-.045em;margin:7px 0}.delta{font-size:11px;color:var(--green);font-weight:650}.delta.warn{color:var(--yellow)}.delta.bad{color:var(--red)}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.impact-card{background:linear-gradient(135deg,#103655,#174f77);color:white;border-radius:12px;padding:20px 22px;box-shadow:0 7px 18px #173e6020}.impact-card:nth-child(2){background:linear-gradient(135deg,#155e4b,#218364)}.impact-card:nth-child(3){background:linear-gradient(135deg,#5b438d,#7b61b2)}.impact-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.impact-label{font-size:12px;color:#c9dfef;font-weight:650}.impact-card:nth-child(2) .impact-label{color:#d0eee3}.impact-badge{font-size:10px;background:#ffffff20;padding:5px 8px;border-radius:20px;white-space:nowrap}.impact-values{display:flex;align-items:end;gap:12px;margin:15px 0 8px}.impact-values b{font-size:30px;line-height:1;letter-spacing:-.04em}.impact-values span{font-size:12px;color:#d7e7f2;padding-bottom:2px}.impact-arrow{font-size:18px!important;color:#7cc6f4!important}.impact-foot{font-size:11px;color:#bfd6e7}.impact-card:nth-child(2) .impact-foot{color:#cae8dc}.outbox{margin-top:18px}.outbox-empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.confirmation{margin-top:18px;background:#eef8f3;border:1px solid #c6e8d7;border-radius:10px;padding:16px;color:#286b50;font-size:12px}
      .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 5px #18314a05}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.panel h2{font-size:15px;margin:0;letter-spacing:-.01em}.panel p{margin:4px 0 0;color:var(--muted);font-size:12px}.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:650;font-size:12px}.status{font-weight:700;font-size:11px;padding:5px 9px;border-radius:30px;white-space:nowrap}.complete{color:var(--green);background:#e9f7f0}.review{color:var(--yellow);background:#fff7e7}.late{color:var(--red);background:#fff0f1}.draft{color:var(--purple);background:#f1edfd}
      table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:#8090a1;font-weight:650;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border-bottom:1px solid var(--line)}td{padding:14px 20px;border-bottom:1px solid #eef2f6;color:#394a5f}tr:last-child td{border:0}tr.click{cursor:pointer}tr.click:hover td{background:#f8fbff}.provider{font-weight:700;color:var(--ink)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;background:currentColor}.two{grid-template-columns:1.5fr .9fr;margin-top:18px}.activity{padding:2px 20px 12px}.event{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #eef2f6}.event:last-child{border:0}.event-icon{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;background:#edf5ff;color:var(--blue)}.event strong{font-size:12px}.event small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
      .detail-top{display:flex;gap:16px;align-items:center;margin-bottom:23px}.back{border:0;background:white;border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer;color:#476078}.detail-title{display:flex;justify-content:space-between;align-items:flex-start}.detail-title h2{font-size:25px;margin:3px 0}.detail-title p{margin:4px 0;color:var(--muted);font-size:13px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px;gap:20px}.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:11px 2px;color:var(--muted);font-size:12px;font-weight:650;cursor:pointer}.tabs button.active{color:var(--blue);border-color:var(--blue)}
      .checklist{padding:5px 20px}.check{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #eef2f6;align-items:center}.check:last-child{border:0}.checkmark{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}.checkmark.y{background:#fff3d9;color:var(--yellow)}.checkmark.g{background:#e5f7ee;color:var(--green)}.check strong{font-size:13px}.check small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.contact{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #eef2f6}.contact:last-child{border:0}.contact .circle{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e8f1fa;color:#37688d;font-size:11px;font-weight:800}.contact b{font-size:12px}.contact span{display:block;color:var(--muted);font-size:11px}
      .form-wrap{max-width:920px}.stepper{display:flex;gap:10px;margin:0 0 22px}.step{font-size:11px;color:#8090a1;display:flex;align-items:center;gap:7px}.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e7edf3;font-weight:700}.step.on{color:var(--blue);font-weight:700}.step.on i{background:var(--blue);color:#fff}.form{padding:26px}.section-title{display:flex;align-items:center;gap:10px;margin:4px 0 20px}.section-title .num{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--blue);background:#eaf4ff;font-size:12px;font-weight:800}.section-title h2{margin:0;font-size:16px}.section-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#34475c}.req{color:var(--red)}input,select,textarea{border:1px solid #d8e1ea;border-radius:7px;padding:10px 11px;color:var(--ink);outline:none;background:#fff;font-size:13px}input:focus,select:focus,textarea:focus{border-color:#4c9add;box-shadow:0 0 0 3px #e3f2fe}textarea{min-height:100px;resize:vertical}.helper{font-size:11px;color:var(--muted)}.form-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px;margin-top:25px}.btn{border:0;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#1662ba}.btn.secondary{border:1px solid #ced9e3;color:#436079;background:white}.notice{background:#edf7ff;border:1px solid #cfe9fb;border-radius:9px;padding:12px 14px;color:#376180;font-size:12px;margin-bottom:18px}
      .metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px}.metric{border:1px solid var(--line);padding:12px;border-radius:9px}.metric b{font-size:22px;display:block}.metric span{color:var(--muted);font-size:11px}.flag{display:flex;gap:13px;padding:16px 20px;border-bottom:1px solid #edf1f5}.flag:last-child{border:0}.flag-icon{width:30px;height:30px;border-radius:50%;background:#fff0f1;color:var(--red);display:grid;place-items:center;font-weight:800;flex:none}.flag h3{font-size:13px;margin:0}.flag p{font-size:11px;color:var(--muted);margin:4px 0}.flag-meta{margin-left:auto;text-align:right}.flag-meta small{display:block;font-size:10px;color:var(--muted);margin:5px 0}
      .message{margin:20px;border:1px solid var(--line);border-radius:9px;padding:20px;background:#fbfdff}.message .to{font-size:12px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:14px}.message .subject{font-size:13px;font-weight:750;margin-bottom:14px}.message p{font-size:13px;line-height:1.6;color:#425469}.success{background:#e9f7f0;border:1px solid #bce5cf;color:#246c50;border-radius:8px;padding:11px 13px;font-size:12px;margin-top:13px}.report{max-width:900px;margin:auto;padding:48px 58px}.report-kicker{text-transform:uppercase;letter-spacing:.15em;color:var(--blue);font-size:10px;font-weight:800}.report h1{font-family:Georgia,serif;font-size:35px;letter-spacing:-.04em;margin:8px 0}.report-lead{color:#617187;font-size:14px;line-height:1.6;border-bottom:1px solid var(--line);padding-bottom:24px}.report h2{font-family:Georgia,serif;font-size:20px;margin:31px 0 10px}.report p{color:#4a5b70;font-size:13px;line-height:1.7}.report-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.report-metric{background:#f5f9fd;border-radius:8px;padding:15px}.report-metric b{font-size:26px;display:block;color:var(--navy)}.report-metric span{font-size:11px;color:var(--muted)}.quote{border-left:3px solid #59a7df;padding:4px 0 4px 16px;color:#405d78;font-family:Georgia,serif;font-size:15px;line-height:1.55;margin:18px 0}
      .toast{position:fixed;right:28px;bottom:26px;background:#173e60;color:white;padding:13px 16px;border-radius:8px;font-size:12px;box-shadow:0 10px 25px #173e6044}.empty{padding:30px;color:var(--muted);font-size:13px;text-align:center}@media(max-width:1100px){.impact{grid-template-columns:1fr 1fr}.impact-card:last-child{grid-column:1/-1}}@media(max-width:900px){.sidebar{width:64px;padding:20px 8px}.brand strong,.brand small,.nav-label,.nav button:not(.icon),.side-foot{display:none}.brand{padding:0 7px 28px}.nav button{font-size:0;text-align:center}.nav .icon{font-size:16px}.sidebar+main{margin-left:64px;padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}@media(max-width:620px){main{padding:16px}.topbar{display:block}.period{display:inline-block;margin-top:14px}.stats,.impact{grid-template-columns:1fr}.impact-card:last-child{grid-column:auto}.stat{padding:13px}.stat .value{font-size:24px}.report{padding:28px 22px}.report-metrics{grid-template-columns:1fr}.flag-meta{display:none}table th:nth-child(3),table td:nth-child(3),table th:nth-child(4),table td:nth-child(4){display:none}}
    </style>
  </head>
  <body><div id="root"></div>
    <script type="text/babel">
      const {useState} = React;
      const providersInitial = [
        {id:1,name:"Piedmont Community College",type:"Training provider",program:"Advanced Manufacturing",status:"Needs review",tone:"review",due:"Submitted Sep 15",missing:"2 items",enrolled:18,completed:10,placed:7},
        {id:2,name:"Triad Workforce Alliance",type:"Training provider",program:"Healthcare Pathways",status:"Complete",tone:"complete",due:"Submitted Sep 12",missing:"—",enrolled:24,completed:18,placed:14},
        {id:3,name:"Central Carolina Skills",type:"Training provider",program:"IT Support",status:"Late",tone:"late",due:"3 days overdue",missing:"Not submitted",enrolled:12,completed:6,placed:3},
        {id:4,name:"NorthStar Career Network",type:"Employment liaison",program:"Employer Partnerships",status:"In progress",tone:"draft",due:"Due Sep 22",missing:"1 item",enrolled:9,completed:4,placed:5},
      ];
      const participants=[
        ["Jordan","Lewis","Sep 02, 2026","Dec 14, 2026","No","—","Missing completion date"],
        ["Maya","Foster","Jul 12, 2026","Aug 28, 2026","Yes","Sep 05, 2026","Complete"],
        ["Darius","Williams","Jun 04, 2026","Aug 30, 2026","Yes","Sep 09, 2026","Complete"],
        ["Amara","Jones","Aug 18, 2026","—","No","—","Active training"],
        ["Ethan","Rivera","May 21, 2026","Aug 14, 2026","Yes","—","Missing job start date"],
      ];
      const Icon=({children})=><span className="icon">{children}</span>;
      const Status=({tone,children})=><span className={"status "+tone}>{children}</span>;
      function Sidebar({page,setPage}){const nav=[["dashboard","▦","Dashboard"],["provider","◉","Subawardees"],["intake","▤","Monthly intake"],["participants","◎","Participant review"],["review","⚑","Review queue"],["nudges","✉","Nudges"],["ppr","▤","Quarterly draft"]];const reset=()=>{["s4g-intake-submission","s4g-notification-log","s4g-workbook-imported","s4g-export-confirmation"].forEach(k=>localStorage.removeItem(k));location.reload()};return <aside className="sidebar"><div className="brand"><div className="mark">S4</div><div><strong>Steps4Growth</strong><small>Reporting center</small></div></div><div className="nav-label">Workspace</div><nav className="nav">{nav.map(([id,icon,label])=><button className={page===id?"active":""} onClick={()=>setPage(id)} key={id}><Icon>{icon}</Icon>{label}</button>)}</nav><div className="side-foot"><span className="avatar">NC</span>NC A&T Team<br/><span style={{paddingLeft:36}}>Demo workspace</span><button onClick={reset} style={{display:"block",marginTop:14,border:0,background:"transparent",color:"#9fc1d8",padding:0,cursor:"pointer",fontSize:11}}>↻ Reset demo data</button></div></aside>}
      function Header({title,subtitle}){return <header className="topbar"><div><div className="eyebrow">Steps4Growth · synthetic demo</div><h1>{title}</h1>{subtitle&&<div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>{subtitle}</div>}</div><div className="period">September 2026 reporting cycle</div></header>}
      function Dashboard({providers,setPage,completed}){const completeCount=providers.filter(p=>p.status==="Complete").length+(completed?1:0);return <><Header title="Reporting dashboard" subtitle="A clear view of this month’s reporting readiness."/><div className="grid stats"><Stat label="Reporting organizations" value="24" note="3 groups across the network"/><Stat label="Complete submissions" value={completeCount+"/24"} note="2 submitted early" cls=""/><Stat label="Needs follow-up" value="7" note="3 late · 4 incomplete" cls="warn"/><Stat label="Open review flags" value={completed?"3":"4"} note="Human review required" cls="bad"/></div><ImpactMetrics/><div className="panel"><div className="panel-head"><div><h2>September submission status</h2><p>Third Thursday due date: September 17, 2026</p></div><button className="link" onClick={()=>setPage("provider")}>View all subawardees →</button></div><table><thead><tr><th>Subawardee</th><th>Program</th><th>Status</th><th>Submission</th><th>Action</th></tr></thead><tbody>{providers.map(p=><tr className="click" onClick={()=>setPage("provider")} key={p.id}><td><div className="provider">{p.name}</div><span style={{color:"var(--muted)",fontSize:11}}>{p.type}</span></td><td>{p.program}</td><td><Status tone={p.tone}>{p.status}</Status></td><td>{p.due}<br/><span style={{color:p.missing==="—"?"var(--muted)":"var(--red)",fontSize:11}}>{p.missing}</span></td><td><button className="link">{p.status==="Late"?"Send reminder":"Review →"}</button></td></tr>)}</tbody></table></div><div className="grid two"><div className="panel"><div className="panel-head"><div><h2>Review priority</h2><p>Items requiring a human decision</p></div><button className="link" onClick={()=>setPage("review")}>Open queue →</button></div><div className="activity"><Event icon="!" title="Completion total needs verification" text="Piedmont Community College · reported 12, records show 10"/><Event icon="×" title="Missing completion date" text="Jordan Lewis · participant record"/><Event icon="!" title="Technical report not submitted" text="Central Carolina Skills · 3 days overdue"/></div></div><div className="panel"><div className="panel-head"><div><h2>Why this matters</h2></div><div style={{padding:20}}><div style={{fontSize:26,fontWeight:750,color:"var(--navy)"}}>Days → hours</div><p style={{lineHeight:1.65,fontSize:13,marginTop:8}}>Structured intake and visible gaps help the team spend less time finding files and chasing missing information.</p><button className="btn primary" onClick={()=>setPage("intake")} style={{marginTop:8}}>Open structured intake</button></div></div></div></>}
      function ImpactMetrics(){return <div className="impact"><div className="impact-card"><div className="impact-head"><div className="impact-label">Median days from due date to complete</div><div className="impact-badge">7 days saved</div></div><div className="impact-values"><b>8 days</b><span className="impact-arrow">→</span><b>1 day</b></div><div className="impact-foot">Manual baseline → projected structured workflow</div></div><div className="impact-card"><div className="impact-head"><div className="impact-label">Monthly submissions complete on first attempt</div><div className="impact-badge">+40 points</div></div><div className="impact-values"><b>35%</b><span className="impact-arrow">→</span><b>75%</b></div><div className="impact-foot">Manual baseline → projected structured workflow</div></div><div className="impact-card"><div className="impact-head"><div className="impact-label">Quarterly PPR preparation time</div><div className="impact-badge">80 hours saved</div></div><div className="impact-values"><b>100 hrs</b><span className="impact-arrow">→</span><b>20 hrs</b></div><div className="impact-foot">Manual baseline → projected review and finalization</div></div></div>}
      function Stat({label,value,note,cls=""}){return <div className="stat"><div className="label">{label}</div><div className="value">{value}</div><div className={"delta "+cls}>{cls==="warn"?"● ":cls==="bad"?"● ":"↑ "}{note}</div></div>}
      function Event({icon,title,text}){return <div className="event"><div className="event-icon">{icon}</div><div><strong>{title}</strong><small>{text}</small></div></div>}
      function Provider({setPage,completed}){return <><div className="detail-top"><button className="back" onClick={()=>setPage("dashboard")}>← Dashboard</button><div className="detail-title" style={{flex:1}}><div><div className="eyebrow">Training provider · TP-017</div><h2>Piedmont Community College</h2><p>Advanced Manufacturing · Central region</p></div><Status tone={completed?"complete":"review"}>{completed?"Complete":"Needs review"}</Status></div></div><div className="tabs"><button className="active">Overview</button><button onClick={()=>setPage("intake")}>Monthly intake</button><button onClick={()=>setPage("participants")}>Participant data</button><button onClick={()=>setPage("review")}>Review history</button></div><div className="grid two"><div className="panel"><div className="panel-head"><div><h2>September reporting checklist</h2><p>{completed?"All required information has been submitted.":"Two items need attention before the monthly file is complete."}</p></div>{!completed&&<button className="btn primary" onClick={()=>setPage("intake")}>Complete intake</button>}</div><div className="checklist"><Check ok label="EDA participant data" text="18 participants imported · received Sep 15"/><Check ok label="Successes and achievements" text="Narrative submitted"/><Check ok={completed} label="Challenges and action plan" text={completed?"Narrative submitted":"Required narrative response is blank"}/><Check ok={completed} label="Completion total verified" text={completed?"Human reviewer confirmed the total.":"Reported 12 · participant records show 10"}/></div></div><div className="panel"><div className="panel-head"><div><h2>Nudge recipients</h2><p>Configured contacts for reporting follow-up</p></div><Contact initials="JA" name="Jordan Alvarez" role="Principal investigator · Primary"/><Contact initials="MS" name="Miriam Stone" role="Finance · CC"/><Contact initials="TS" name="Tasha Smith" role="Instructor · CC"/><div style={{padding:14}}><button className="btn secondary" onClick={()=>setPage("nudges")}>Preview reminder</button></div></div></div><div className="grid two" style={{marginTop:18}}><div className="panel"><div className="panel-head"><h2>Selected September metrics</h2><button className="link" onClick={()=>setPage("participants")}>View records →</button></div><div className="metric-row"><Metric n="18" t="Enrolled"/><Metric n="10" t="Completed"/><Metric n="7" t="Placed"/><Metric n={completed?"0":"2"} t="Open gaps"/></div></div><div className="panel"><div className="panel-head"><h2>Activity</h2></div><div className="activity"><Event icon="✓" title={completed?"Intake submitted and reviewed":"Participant workbook received"} text={completed?"Just now":"Sep 15 · 10:42 AM"}/><Event icon="!" title="Review flag raised" text="Completion total variance · Sep 15"/></div></div></div></>}
      function Check({ok,label,text}){return <div className="check"><div className={"checkmark "+(ok?"g":"y")}>{ok?"✓":"!"}</div><div><strong>{label}</strong><small>{text}</small></div><Status tone={ok?"complete":"review"}>{ok?"Complete":"Action needed"}</Status></div>}
      function Contact({initials,name,role}){return <div className="contact"><div className="circle">{initials}</div><div><b>{name}</b><span>{role}</span></div></div>}
      function Metric({n,t}){return <div className="metric"><b>{n}</b><span>{t}</span></div>}

      function Participants(){const [imported,setImported]=useState(()=>localStorage.getItem("s4g-workbook-imported")==="true");const [importing,setImporting]=useState(false);const runImport=()=>{if(imported)return;setImporting(true);setTimeout(()=>{localStorage.setItem("s4g-workbook-imported","true");setImported(true);setImporting(false)},900)};return <><Header title="Participant data review" subtitle="Synthetic EDA-aligned records · Piedmont Community College"/><div className="notice">This demo uses fictional participants. The production EDA tool contains additional data points, macros, and reporting sheets.</div><div className="panel"><div className="panel-head"><div><h2>Participant Database</h2><p>Selected fields used for monthly review and reconciliation</p></div><button className="btn secondary" onClick={runImport} disabled={importing||imported}>{importing?"Reading workbook…":imported?"Workbook imported ✓":"Simulate workbook import"}</button></div>{imported?<><div className="success" style={{margin:"16px 18px 0"}}>✓ EDA Survey Tool imported: 18 participant records checked, 2 data-quality issues added to the review queue.</div><div className="metric-row"><Metric n="18" t="Participant records"/><Metric n="10" t="Training complete"/><Metric n="7" t="Job placements"/><Metric n="2" t="Missing data"/></div><table><thead><tr><th>Participant</th><th>Training start</th><th>Training end</th><th>Completed</th><th>Job start</th><th>Data quality</th></tr></thead><tbody>{participants.map((p,i)=><tr key={i}><td><span className="provider">{p[0]} {p[1]}</span></td><td>{p[2]}</td><td>{p[3]}</td><td>{p[4]}</td><td>{p[5]}</td><td><Status tone={p[6]==="Complete"?"complete":p[6]==="Active training"?"draft":"review"}>{p[6]}</Status></td></tr>)}</tbody></table></>:<div className="empty"><b>No workbook imported for this reporting cycle.</b><br/><span>Use the button above to load and validate a synthetic EDA Survey Tool.</span></div>}</div></>}

      function App(){const saved=(()=>{try{return JSON.parse(localStorage.getItem("s4g-intake-submission"))}catch{return null}})();const [page,setPage]=useState("dashboard");const [providers,setProviders]=useState(()=>saved?providersInitial.map(p=>p.id===1?{...p,status:"Complete",tone:"complete",missing:"—",due:"Submitted previously"}:p):providersInitial);const [completed,setCompleted]=useState(Boolean(saved));const [resolved,setResolved]=useState(Boolean(saved));const [sent,setSent]=useState(()=>{try{return JSON.parse(localStorage.getItem("s4g-notification-log"))}catch{return null}});const [reportData,setReportData]=useState(saved);const submit=(data)=>{const record={...data,enrolled:18,completed:10,placed:7,submittedAt:new Date().toLocaleString()};localStorage.setItem("s4g-intake-submission",JSON.stringify(record));setCompleted(true);setResolved(true);setReportData(record);setProviders(ps=>ps.map(p=>p.id===1?{...p,status:"Complete",tone:"complete",missing:"—",due:"Submitted just now"}:p))};const logNudge=()=>{const record={organization:"Central Carolina Skills",recipient:"Carlos Bennett, PI",timestamp:new Date().toLocaleString(),status:"Simulated sent"};localStorage.setItem("s4g-notification-log",JSON.stringify(record));setSent(record)};let content={dashboard:<Dashboard providers={providers} setPage={setPage} completed={completed}/>,provider:<Provider setPage={setPage} completed={completed}/>,intake:<Intake setPage={setPage} onSubmit={submit}/>,participants:<Participants/>,review:<Review setPage={setPage} resolved={resolved} setResolved={setResolved}/>,nudges:<Nudges sent={sent} onSend={logNudge}/>,ppr:<PPR reportData={reportData}/>}[page];return <div className="app"><Sidebar page={page} setPage={setPage}/><main>{content}</main></div>}

        function review(){return shell("review","Review queue","Flags guide human attention; they do not make reporting decisions.",`<div class="grid stats">${stat("Open flags",completed?"3":"4","Across 3 providers","bad")}${stat("Missing information","2","Required fields or dates","warn")}${stat("Reported variances",completed?"0":"1","Requires confirmation","warn")}${stat("Resolved this month",completed?"6":"5","Reviewer-confirmed")}</div><div class="panel"><div class="panel-head"><div><h2>Items requiring review</h2><p>Prioritized by impact on the monthly file</p></div></div>${!completed?flag("Completion total does not match participant records","Piedmont Community College reported 12 completions. The selected participant dataset currently shows 10.","High priority","confirm-total","Confirm total"):''}${flag("Missing training completion date","Jordan Lewis is marked as active, but the technical report includes this participant in the completion count.","Data quality","participants","View record")}${flag("Monthly technical report not submitted","Central Carolina Skills is three days past the September due date.","Follow-up","nudges","Preview nudge")}${flag("Salary reporting percentage is blank","Triad Workforce Alliance did not provide the optional salary coverage percentage.","Low priority","dashboard","Dismiss")}</div>`)}
        const flag=(title,text,tag,target,label)=>`<div class="flag"><div class="flag-icon">!</div><div><h3>${title}</h3><p>${text}</p>${status("review",tag)}</div><div class="flag-meta"><small>Sep 16, 2026</small><button class="link" data-page="${target}">${label} →</button></div></div>`;
        function nudges(){return shell("nudges","Smart nudges","Clear follow-up, directed to the people best positioned to respond.",`<div class="grid two"><div class="panel"><div class="panel-head"><div><h2>Recommended follow-up</h2><p>Based on missing items and reporting due date</p></div>${status("late","1 overdue")}</div><div class="checklist">${check(false,"Central Carolina Skills","Technical report not submitted · 3 days overdue")}${check(false,"Piedmont Community College","Completion total needs reviewer confirmation")}${check(true,"Triad Workforce Alliance","No action required")}</div></div><div class="panel"><div class="panel-head"><div><h2>Reminder preview</h2><p>Email delivery is safely simulated for this demo.</p></div></div><div class="message"><div class="to"><b>To:</b> Carlos Bennett, PI<br/><span style="color:var(--muted)"><b>CC:</b> Finance contact, instructor</span></div><div class="subject">Action needed: September Steps4Growth report</div><p>Hello Carlos,<br/><br/>The September technical report for Central Carolina Skills has not yet been received. Please submit the structured report and participant-data update so NC A&T can complete monthly review.<br/><br/>Current due date: September 17, 2026<br/>Status: 3 days overdue</p><button class="btn primary" id="send-nudge">${sent?"Reminder logged":"Send simulated reminder"}</button>${sent?'<div class="success">✓ Reminder logged at 10:18 AM. In production, this could send through NC A&T’s approved email service.</div>':''}</div></div></div>`)}
        function ppr(){const d=(()=>{try{return JSON.parse(localStorage.getItem("s4g-intake-submission"))}catch{return null}})();const exported=localStorage.getItem("s4g-export-confirmation");const enrolled=45+(d?.enrolled||18),completions=28+(d?.completed||10),placements=20+(d?.placed||7);return shell("ppr","Quarterly draft","Q3 2026 · Assembled from structured intake and participant data",`<div class="notice"><b>Traceable assembly:</b> July–August synthetic baseline + September participant import + submitted monthly narrative.</div><div class="panel report"><div class="report-kicker">Steps4Growth · Program Progress Report</div><h1>Quarterly progress draft</h1><div class="report-lead">This draft is assembled from the data entered through intake and the coded EDA Summary Sheet contract. Every displayed value has a visible source.</div><div class="report-metrics">${metric(enrolled,"Participants enrolled")}${metric(completions,"Training completions")}${metric(placements,"Job placements")}</div><h2>Program achievements</h2><p>${d?.achievements||"Complete the September structured intake to replace this placeholder with the provider’s submitted narrative."}</p><h2>Challenges and response</h2><p>${d?.challenges||"No September challenge narrative has been submitted yet."}</p><p><b>Action plan:</b> ${d?.plan||"Awaiting the structured monthly intake."}</p><h2>Data provenance</h2><p>Provider: Piedmont Community College · Program: Advanced Manufacturing · September contribution: ${d?.enrolled||18} enrolled, ${d?.completed||10} completed, ${d?.placed||7} placed.</p><h2>Success story</h2><div class="quote">“The new manufacturing pathway gave me a clear way to move from training into a job I can grow with.”</div><p>Participant stories and supporting narratives remain available for human editing before final submission.</p><div style="border-top:1px solid var(--line);padding-top:20px;margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:11px;color:var(--muted)">Draft status · synthetic data · ${d?"intake connected":"awaiting intake"}</span><div><button class="btn secondary" id="print-report">Print preview</button> <button class="btn primary" id="download-summary">Generate EDA summary (.csv)</button></div></div>${exported?`<div class="confirmation">✓ Output generated successfully on ${exported}. The file was downloaded locally; no data was transmitted to EDA.</div>`:""}</div>`)}
        const render=page=>{root.innerHTML=({dashboard,provider,intake,participants,review,nudges,ppr}[page]||dashboard)();root.querySelectorAll("[data-page]").forEach(el=>el.onclick=e=>{e.preventDefault();render(el.dataset.page)});const submit=root.querySelector("#submit-intake");if(submit)submit.onclick=()=>{const ch=root.querySelector("#challenges"),pl=root.querySelector("#plan");if(!ch.value||!pl.value){root.querySelector("#form-error").innerHTML='<div class="notice" style="background:#fff0f1;border-color:#f4cbd0;color:var(--red)">Please complete the challenges and action-plan fields before submitting.</div>';return}completed=true;reportNote=root.querySelector("#achievements").value;localStorage.setItem("s4g-intake-submission",JSON.stringify({achievements:reportNote,challenges:ch.value,plan:pl.value,enrolled:18,completed:10,placed:7,submittedAt:new Date().toLocaleString()}));render("review")};const confirm=root.querySelector('[data-page="confirm-total"]');if(confirm)confirm.onclick=e=>{e.preventDefault();completed=true;render("review")};const send=root.querySelector("#send-nudge");if(send)send.onclick=()=>{sent={organization:"Central Carolina Skills",recipient:"Carlos Bennett, PI",timestamp:new Date().toLocaleString(),status:"Simulated sent"};localStorage.setItem("s4g-notification-log",JSON.stringify(sent));render("nudges")};const importBtn=root.querySelector("#import-workbook");if(importBtn)importBtn.onclick=()=>{importBtn.textContent="Reading workbook…";importBtn.disabled=true;setTimeout(()=>{imported=true;localStorage.setItem("s4g-workbook-imported","true");render("participants")},900)};const download=root.querySelector("#download-summary");if(download)download.onclick=()=>{const d=(()=>{try{return JSON.parse(localStorage.getItem("s4g-intake-submission"))}catch{return null}})()||{achievements:reportNote,challenges:"Reporting completeness remains uneven.",plan:"Continue monthly review.",enrolled:18,completed:10,placed:7};const csv=`tp_name,tp_program,part_enroll,part_comp,job_placements,achievements,challenges,action_plan\n"Piedmont Community College","Advanced Manufacturing",${d.enrolled},${d.completed},${d.placed},"${d.achievements.replaceAll('"','""')}","${d.challenges.replaceAll('"','""')}","${d.plan.replaceAll('"','""')}"`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="steps4growth-q3-eda-summary.csv";a.click();URL.revokeObjectURL(a.href);localStorage.setItem("s4g-export-confirmation",new Date().toLocaleString());render("ppr")};const print=root.querySelector("#print-report");if(print)print.onclick=()=>window.print()};
        render("dashboard");
        const addPprImpact=()=>{const impact=root.querySelector(".impact");if(impact&&impact.children.length<3)impact.insertAdjacentHTML("beforeend",'<div class="impact-card"><div class="impact-head"><div class="impact-label">Quarterly PPR preparation time</div><div class="impact-badge">80 hours saved</div></div><div class="impact-values"><b>100 hrs</b><span class="impact-arrow">→</span><b>20 hrs</b></div><div class="impact-foot">Manual baseline → projected review and finalization</div></div>')};
        const addOutbox=()=>{if(!root.querySelector("h1")?.textContent.includes("Smart nudges")||root.querySelector(".outbox"))return;const record=(()=>{try{return JSON.parse(localStorage.getItem("s4g-notification-log"))}catch{return null}})();root.querySelector("main").insertAdjacentHTML("beforeend",`<div class="panel outbox"><div class="panel-head"><div><h2>Notification outbox</h2><p>Auditable history of automated follow-up actions</p></div>${status(record?"complete":"draft",record?"1 logged":"No messages")}</div>${record?`<table><thead><tr><th>Organization</th><th>Recipient</th><th>Reason</th><th>Time</th><th>Status</th></tr></thead><tbody><tr><td><span class="provider">${record.organization}</span></td><td>${record.recipient}</td><td>Monthly report overdue</td><td>${record.timestamp}</td><td>${status("complete","Simulated sent")}</td></tr></tbody></table>`:'<div class="outbox-empty">Sent reminders will appear here with recipients, reason, timestamp, and delivery status.</div>'}</div>`)};
        const addReset=()=>{const foot=root.querySelector(".side-foot");if(!foot||root.querySelector("#reset-demo"))return;foot.insertAdjacentHTML("beforeend",'<button id="reset-demo" style="display:block;margin-top:14px;border:0;background:transparent;color:#9fc1d8;padding:0;cursor:pointer;font-size:11px">↻ Reset demo data</button>');root.querySelector("#reset-demo").onclick=()=>{["s4g-intake-submission","s4g-notification-log","s4g-workbook-imported","s4g-export-confirmation"].forEach(k=>localStorage.removeItem(k));location.reload()}};
        new MutationObserver(()=>{addPprImpact();addOutbox();addReset()}).observe(root,{childList:true,subtree:true});
        addPprImpact();
        addReset();
      })();
    </script>
  </body>
</html>
